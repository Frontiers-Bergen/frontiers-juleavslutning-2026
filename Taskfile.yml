version: "3"

tasks:
  build:templ:
    cmds:
      - go tool templ generate
    sources:
      - "**/*.templ"
    generates:
      - "**/*_templ.go"

  build:
    deps:
      - build:templ
    cmds:
      - go build -o bin/main{{exeExt}} ./cmd/juleavslutning

  start:templ:
    cmds:
      - go tool templ generate -watch

  start:server:
    cmds:
      - |
        go tool air \
          -build.cmd "go build -o tmp/bin/main{{exeExt}} ./cmd/juleavslutning" \
          -build.bin "tmp/bin/main{{exeExt}}" \
          -build.include_ext "go,templ,css,md" \
          -misc.clean_on_exit "true"

  start:
    deps:
      - start:templ
      - start:server

  run:
    deps:
      - build
    cmds:
      - ./bin/main{{exeExt}}

  test:
    deps:
      - build:templ
    cmds:
      - go test ./...

  fmt:
    cmds:
      - gofmt -w .
      - go tool templ fmt -log-level error .

  # Everything a pull request must pass. CI runs the same task.
  # golangci-lint is not a go tool dependency (upstream advises against it); install it separately.
  check:
    deps:
      - build:templ
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "gofmt needed, run: go tool task fmt" >&2
          echo "$unformatted" >&2
          exit 1
        fi
      - go tool templ fmt -fail -log-level error .
      - go vet ./...
      - go fix -diff ./...
      - golangci-lint run ./...
      - go test ./...

  # Screenshots of every screen for visual checks; see browser-tools/screenshots.sh. Needs bash and Chrome/Chromium.
  # Through bash explicitly: Windows cannot run a .sh file itself (on Windows, start it from Git Bash).
  screenshots:
    cmds:
      - bash browser-tools/screenshots.sh {{.CLI_ARGS}}

  # Clicks real buttons in headless Chromium (smash, vote, live slide change); see browser-tools/browser_check.mjs.
  # Needs Node and chromium or google-chrome.
  browser-check:
    cmds:
      - node browser-tools/browser_check.mjs

  # Smashes a local copy of the app with simulated phones; see loadtest/main.go. Local only: never the shared server.
  loadtest:
    cmds:
      - go run ./loadtest {{.CLI_ARGS}}

  default:
    cmds:
      - task: start
