version: "3"

tasks:
  build:templ:
    cmds:
      - go tool templ generate
    sources:
      - "**/*.templ"
    generates:
      - "**/*_templ.go"

  build:
    deps:
      - build:templ
    cmds:
      - go build -tags=prod -o bin/main ./

  start:templ:
    cmds:
      - go tool templ generate -watch

  start:server:
    cmds:
      - |
        go tool air \
          -build.cmd "go build -tags=dev -o tmp/bin/main ./" \
          -build.bin "tmp/bin/main" \
          -build.include_ext "go,templ,css" \
          -misc.clean_on_exit "true"

  start:
    deps:
      - start:templ
      - start:server

  run:
    deps:
      - build
    cmds:
      - ./bin/main

  test:
    deps:
      - build:templ
    cmds:
      - go test ./...

  fmt:
    cmds:
      - gofmt -w .
      - go tool templ fmt -log-level error .

  # Everything a pull request must pass. CI runs the same task.
  # golangci-lint is not a go tool dependency (upstream advises against it); install it separately.
  check:
    deps:
      - build:templ
    cmds:
      - |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          echo "gofmt needed, run: go tool task fmt" >&2
          echo "$unformatted" >&2
          exit 1
        fi
      - go tool templ fmt -fail -log-level error .
      - go vet ./...
      - go fix -diff ./...
      - golangci-lint run ./...
      - go test ./...

  # Screenshots of every screen for visual checks; see screenshots.sh. Needs chromium or google-chrome.
  screenshots:
    cmds:
      - ./screenshots.sh {{.CLI_ARGS}}

  default:
    cmds:
      - task: start
