# CI/CD for the juleavslutning app.
#
# Every pull request runs the same checks a developer runs locally (go tool task check, task browser-check).
# Deploy jobs (a preview per pull request, main on the big screen) are added in deploy/; see deploy/README.md.
name: CI/CD

on:
    push:
        branches: [main]
    pull_request:
        types: [opened, reopened, synchronize, ready_for_review]

# One run at a time per pull request (or per branch for pushes); a newer push waits instead of
# cancelling a run that may be deploying.
concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    check:
        name: task check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            # task check runs golangci-lint from the PATH, like on a developer machine.
            - uses: golangci/golangci-lint-action@v9
              with:
                  version: v2.15.0
                  install-only: true
            - run: go tool task check

    browser-check:
        name: task browser-check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-go@v6
              with:
                  go-version-file: go.mod
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
            # The runner image has Google Chrome; browser_check.mjs finds it on the PATH.
            - run: go tool task browser-check
