  <rect x="30" y="188" width="38" height="32" rx="3" fill="#a599e9"/>
  <rect x="45" y="188" width="8" height="32" fill="#fff"/>
  <path d="M49 188 C40 176 32 182 40 188 M49 188 C58 176 66 182 58 188" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="168" y="182" width="44" height="38" rx="3" fill="#ff9d00"/>
  <rect x="186" y="182" width="8" height="38" fill="#d62839"/>
  <rect x="168" y="196" width="44" height="8" fill="#d62839"/>
  <path d="M190 182 C180 168 172 176 182 182 M190 182 C200 168 208 176 198 182" stroke="#d62839" stroke-width="4" fill="none" stroke-linecap="round"/>
