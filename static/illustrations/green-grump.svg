<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- A green grump in a Santa hat, drawn for the "How to contribute" slide: don't be the Grinch. Our own drawing. -->
  <!-- Head; the hat sits on top of it -->
  <path d="M38 96 C34 70 70 66 100 66 C130 66 166 70 162 96 C170 120 168 158 150 180 C134 200 118 206 100 206 C82 206 66 200 50 180 C32 158 30 120 38 96 Z" fill="#7cb342"/>
  <!-- Ears -->
  <path d="M38 118 C24 112 18 126 26 136 C30 142 38 142 42 138 Z" fill="#689f38"/>
  <path d="M162 118 C176 112 182 126 174 136 C170 142 162 142 158 138 Z" fill="#689f38"/>
  <!-- Santa hat: a solid cone on the head, its tip flopping over to the side -->
  <path d="M40 80 C44 40 80 12 122 12 C156 12 180 34 186 72 C178 62 168 56 160 56 C163 64 165 72 164 80 Z" fill="#d62839"/>
  <!-- The fold where the tip flops over -->
  <path d="M160 56 C168 56 178 62 186 72 C176 50 160 40 146 38 C154 44 158 50 160 56 Z" fill="#a51d2c"/>
  <!-- Hat brim and bobble -->
  <rect x="30" y="72" width="140" height="22" rx="11" fill="#fff"/>
  <circle cx="186" cy="76" r="13" fill="#fff"/>
  <!-- Eyebrows, scheming -->
  <path d="M58 112 L92 124" stroke="#33691e" stroke-width="7" stroke-linecap="round"/>
  <path d="M142 112 L108 124" stroke="#33691e" stroke-width="7" stroke-linecap="round"/>
  <!-- Eyes: yellow, half shut -->
  <path d="M64 136 Q78 126 92 134 Q80 146 64 136 Z" fill="#ffeb3b"/>
  <path d="M136 136 Q122 126 108 134 Q120 146 136 136 Z" fill="#ffeb3b"/>
  <circle cx="81" cy="136" r="4.5" fill="#d62839"/>
  <circle cx="119" cy="136" r="4.5" fill="#d62839"/>
  <!-- Nose -->
  <ellipse cx="100" cy="152" rx="7" ry="5" fill="#33691e"/>
  <!-- The grin -->
  <path d="M62 166 C80 186 120 186 140 162 C128 178 112 184 100 184 C86 184 72 178 62 166 Z" fill="#33691e"/>
  <path d="M62 166 C80 186 120 186 140 162" stroke="#33691e" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
